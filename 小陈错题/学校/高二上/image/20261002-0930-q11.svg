<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 330" width="390" height="330" role="img" aria-labelledby="title">
  <title id="title">Triangular pyramid P-ABC with hidden base edge AC</title>
  <defs>
    <style>
      .edge { fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .hidden { fill: none; stroke: #111; stroke-width: 2; stroke-dasharray: 7 6; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: #111; font-family: "Times New Roman", serif; font-size: 24px; font-style: italic; }
    </style>
  </defs>
  <rect width="390" height="330" fill="#fff" />
  <path class="hidden" d="M90 260 L325 195" />
  <path class="edge" d="M90 65 L90 260 L220 260 L325 195 Z M90 65 L220 260" />
  <text class="label" x="65" y="45">P</text>
  <text class="label" x="64" y="287">A</text>
  <text class="label" x="216" y="295">B</text>
  <text class="label" x="345" y="204">C</text>
</svg>