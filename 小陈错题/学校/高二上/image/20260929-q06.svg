      .edge { fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .hidden { fill: none; stroke: #111; stroke-width: 2; stroke-dasharray: 7 6; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: #111; font-family: "Times New Roman", serif; font-size: 22px; font-style: italic; }
    </style>
  </defs>
  <rect width="410" height="380" fill="#fff" />
